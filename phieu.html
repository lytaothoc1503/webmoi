<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Phiếu xác nhận đặt phòng | Nhà của An Homestay Tà Xùa</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    :root { color-scheme: light; }
    body { margin: 0; background: #f3ede4; font-family: 'Be Vietnam Pro', 'Segoe UI', Arial, sans-serif; color: #1d2b2e; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 14px 0; }
    .bar a, .bar button { background: #0b3b46; color: #fff; border: 0; border-radius: 10px; padding: 11px 18px; font-size: 14px; font-weight: 700; cursor: pointer; text-decoration: none; font-family: inherit; }
    .bar .alt { background: #fff; color: #0b3b46; border: 1.5px solid #0b3b46; }
    .slipbox { overflow-x: auto; }
    .msg { text-align: center; padding: 40px 16px; font-size: 16px; line-height: 1.6; }
    .msg small { display: block; color: #5d6b6e; margin-top: 8px; font-size: 13px; }
    .hint { text-align: center; color: #5d6b6e; font-size: 13px; margin-top: 10px; }
    @media print { body { background: #fff; } .bar, .hint { display: none !important; } .wrap { padding: 0; max-width: none; } .slipbox { overflow: visible; } }
  </style>
</head>
<body>
<div class="wrap">
  <div id="out"><div class="msg">Đang mở phiếu...</div></div>
  <div class="bar" id="bar" hidden>
    <button type="button" id="b-print">In / Lưu PDF</button>
    <button type="button" class="alt" id="b-png">Tải ảnh phiếu</button>
    <a class="alt" id="b-fb" href="#" target="_blank" rel="noopener">Nhắn Messenger cho nhà</a>
    <a class="alt" id="b-tel" href="#" hidden>Gọi hotline</a>
  </div>
  <p class="hint" id="hint" hidden>Trên điện thoại: bấm "In / Lưu PDF" rồi chọn "Lưu dưới dạng PDF" để giữ phiếu trong máy.</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3" integrity="sha384-dl/4LkSyQ4uEucc48NM6VDZLAjLLq9yMzZ5JLXumBq7Ld33XBof73hseOqPhO89+" crossorigin="anonymous"></script>
<script src="config.js?v=20261016a"></script>
<script src="phieu.js?v=20261019c"></script>
<script>
  (function () {
    const out = document.getElementById('out'), S = window.SITE || {}, CFG = S.supabase || {}, C = S.contacts || {};
    const msg = (t, s) => { out.innerHTML = '<div class="msg">' + t + (s ? '<small>' + s + '</small>' : '') + '</div>'; };
    const code = String(new URLSearchParams(location.search).get('ma') || '').trim().toUpperCase();
    if (C.messenger || C.facebook) document.getElementById('b-fb').href = C.messenger || C.facebook; else document.getElementById('b-fb').hidden = true;
    if (C.phone) { const t = document.getElementById('b-tel'); t.href = 'tel:' + String(C.phone).replace(/[^\d+]/g, ''); t.textContent = 'Gọi hotline ' + C.phone; t.hidden = false; }
    if (!/^[A-Z0-9]{6,20}$/.test(code)) { msg('Đường dẫn chưa có mã đơn hợp lệ.', 'Bạn hãy mở lại đúng link nhà đã gửi, hoặc nhắn nhà kèm mã đơn.'); return; }
    if (!CFG.url || !CFG.anonKey || !window.supabase) { msg('Chưa mở được phiếu lúc này.', 'Bạn nhắn nhà kèm mã đơn ' + code + ' để được hỗ trợ.'); return; }
    const db = window.supabase.createClient(CFG.url, CFG.anonKey, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
    const norm = (s) => ({ 'Chờ duyệt tiền cọc': 'Chờ thanh toán', 'Đã duyệt phòng': 'Đặt phòng thành công' }[s] || s || 'Chờ thanh toán');
    db.rpc('track_booking', { p_code: code, p_phone: null }).then(({ data, error }) => {
      if (error) { msg('Chưa mở được phiếu lúc này.', 'Bạn thử lại sau ít phút hoặc nhắn nhà kèm mã đơn ' + code + '.'); return; }
      const r = data && data[0];
      if (!r) { msg('Không tìm thấy đơn mã ' + code + '.', 'Nhà có thể chưa tạo đơn trên hệ thống. Bạn nhắn nhà kèm mã đơn để được kiểm tra.'); return; }
      const st = norm(r.status), done = st === 'Đặt phòng thành công' || st === 'Hoàn thành';
      if (st === 'Hủy đơn') { msg('Đơn ' + code + ' đã được hủy.', 'Cần hỗ trợ thêm, bạn nhắn nhà kèm mã đơn.'); return; }
      const inv = st === 'Sai nội dung chuyển khoản', ct = st === 'Cần liên hệ nhà';
      const total = Number(r.total_price) || 0;
      out.innerHTML = '<div class="slipbox">' + window.NCA_slip({ code: r.booking_code, tcode: r.transfer_code || r.booking_code, name: r.fullname, guests: r.guests || '', room: r.room, roomNo: r.slip_room_no || '', checkin: r.checkin, checkout: r.checkout, total: total, paid: done ? total : 0, promo: r.slip_promo || '', extra: r.slip_note || '', bankName: r.slip_bank_name || '', accountNo: r.slip_bank_account || '', accountName: r.slip_bank_holder || '', hideBank: st !== 'Chờ thanh toán', invalid: inv, invalidReason: inv ? (r.admin_note || '') : '', contact: ct, contactReason: ct ? (r.admin_note || '') : '', nowStep: st === 'Hoàn thành' ? 3 : (done ? 2 : 1) }) + '</div>';
      document.getElementById('bar').hidden = false; document.getElementById('hint').hidden = false;
      document.title = 'Phiếu xác nhận ' + r.booking_code + ' | Nhà của An';
    }).catch(() => msg('Chưa mở được phiếu lúc này.', 'Bạn thử lại sau ít phút.'));
    document.getElementById('b-png').addEventListener('click', () => {
      const el = out.querySelector('.nca-slip'); if (!el) return;
      const go = () => window.html2canvas(el, { scale: 2, backgroundColor: '#ffffff', useCORS: true, windowWidth: 1100 }).then((cv) => { const a = document.createElement('a'); a.download = 'phieu-' + code + '.png'; a.href = cv.toDataURL('image/png'); a.click(); }).catch(() => alert('Chưa tạo được ảnh, bạn dùng nút In / Lưu PDF nhé.'));
      if (window.html2canvas) go(); else { const sc = document.createElement('script'); sc.src = 'vendor/html2canvas.min.js'; sc.onload = go; document.head.appendChild(sc); }
    });
    document.getElementById('b-print').addEventListener('click', () => {
      const s = document.createElement('style'); s.textContent = '@page{size:A4 landscape;margin:0}'; document.head.appendChild(s);
      const fin = () => { s.remove(); window.removeEventListener('afterprint', fin); }; window.addEventListener('afterprint', fin); window.print();
    });
  })();
</script>
</body>
</html>
