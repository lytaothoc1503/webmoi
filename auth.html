<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xmagic - Admin Authentication</title>
    <style>
        body { margin: 0; background-color: #0a0a0a; color: #d4af37; font-family: 'Helvetica Neue', Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .auth-container { background: linear-gradient(145deg, #1a1a1a, #000000); border: 1px solid #d4af37; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(212, 175, 55, 0.1); width: 100%; max-width: 400px; text-align: center; }
        .logo { font-size: 28px; font-weight: bold; letter-spacing: 2px; margin-bottom: 30px; text-transform: uppercase; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 12px; margin-bottom: 5px; color: #a9a9a9; text-transform: uppercase; letter-spacing: 1px; }
        .input-group input { width: 100%; padding: 12px; background-color: #111; border: 1px solid #333; color: #fff; border-radius: 6px; box-sizing: border-box; font-size: 14px; transition: border-color 0.3s; }
        .input-group input:focus { outline: none; border-color: #d4af37; }
        .btn-submit { width: 100%; padding: 14px; background-color: #d4af37; color: #000; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; transition: all 0.3s; text-transform: uppercase; letter-spacing: 1px; }
        .btn-submit:hover { background-color: #f3c746; box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="logo">Xmagic Portal</div>
    <form id="secret-admin-form">
        <div class="input-group">
            <label for="sec-adm-user">Tài khoản</label>
            <input type="text" id="sec-adm-user" required autocomplete="off">
        </div>
        <div class="input-group">
            <label for="sec-adm-pass">Mật khẩu</label>
            <input type="password" id="sec-adm-pass" required autocomplete="off">
        </div>
        <div class="input-group">
            <label for="sec-adm-pin">Mã PIN</label>
            <input type="password" id="sec-adm-pin" required autocomplete="off" maxlength="6">
        </div>
        <button type="submit" class="btn-submit">Truy cập hệ thống</button>
    </form>
</div>
