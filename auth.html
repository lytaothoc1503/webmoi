<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Quản trị | Nhà của An Homestay Tà Xùa</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        body { margin: 0; background-color: #1c110a; color: #f5eee8; font-family: 'Helvetica Neue', Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; box-sizing: border-box; }
        .auth-container { background: #2b1b11; border: 1px solid #d96b27; padding: 36px 32px; border-radius: 14px; width: 100%; max-width: 400px; text-align: center; }
        .logo { font-size: 24px; font-weight: bold; letter-spacing: 1px; margin-bottom: 4px; }
        .sub { font-size: 12px; color: #d96b27; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 26px; }
        .input-group { margin-bottom: 16px; text-align: left; }
        .input-group label { display: block; font-size: 12px; margin-bottom: 5px; color: #b9a99a; }
        .input-group input { width: 100%; padding: 12px; background-color: #1c110a; border: 1px solid #4a3425; color: #fff; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        .input-group input:focus { outline: none; border-color: #d96b27; }
        .btn-submit { width: 100%; padding: 13px; background-color: #d96b27; color: #fff; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; }
        .btn-submit:disabled { opacity: .6; cursor: wait; }
        .msg { margin-top: 14px; font-size: 13px; color: #fca5a5; min-height: 18px; }
        .back { display: inline-block; margin-top: 16px; font-size: 12.5px; color: #b9a99a; }
    </style>
</head>
<body>
<div class="auth-container">
    <div class="logo">Nhà của An</div>
    <div class="sub">Khu vực quản trị</div>
    <form id="admin-login-form" autocomplete="on" novalidate>
        <div class="input-group">
            <label for="adm-email">Email quản trị</label>
            <input type="email" id="adm-email" name="username" required autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="email" placeholder="email quản trị">
        </div>
        <div class="input-group">
            <label for="adm-pass">Mật khẩu</label>
            <input type="password" id="adm-pass" name="password" required minlength="6" autocomplete="current-password" placeholder="mật khẩu">
        </div>
        <button type="submit" class="btn-submit" id="adm-btn">Đăng nhập</button>
        <div class="msg" id="adm-msg"></div>
    </form>
    <a class="back" href="./index.html">← Về trang chủ</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
    const CFG = (window.SITE && window.SITE.supabase) || {};
    const msg = document.getElementById('adm-msg');
    if (!CFG.url || !CFG.anonKey) {
        msg.textContent = 'Cơ sở dữ liệu chưa được cấu hình. Hãy điền url và anonKey của Supabase trong file config.js.';
        document.getElementById('adm-btn').disabled = true;
    } else {
        const client = window.supabase.createClient(CFG.url, CFG.anonKey);
        const goAdmin = () => window.location.replace('./admin.html');
        async function isAdmin() { const { data } = await client.auth.getSession(); if (!data || !data.session) return false; const r = await client.rpc('is_admin'); return r.data === true; }
        // Đã là admin thì vào thẳng; nếu đang là tài khoản khách thì vẫn cho đăng nhập admin (sẽ thay phiên đăng nhập)
        isAdmin().then((ok) => { if (ok) goAdmin(); });
        document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('adm-btn');
            const email = document.getElementById('adm-email').value.trim(), password = document.getElementById('adm-pass').value;
            if (!email || !password) { msg.textContent = 'Vui lòng nhập đủ email và mật khẩu.'; return; }
            btn.disabled = true; msg.textContent = '';
            const { error } = await client.auth.signInWithPassword({ email, password });
            if (error) { msg.textContent = 'Đăng nhập không thành công: email hoặc mật khẩu chưa đúng.'; btn.disabled = false; return; }
            if (await isAdmin()) { goAdmin(); return; }
            await client.auth.signOut();
            msg.textContent = 'Tài khoản này chưa được cấp quyền quản trị.'; btn.disabled = false;
        });
    }
</script>
</body>
</html>
