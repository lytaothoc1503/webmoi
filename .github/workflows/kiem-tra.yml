name: Kiểm tra web
# Chỉ kiểm tra và báo lỗi. Không chặn việc đưa web lên GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  kiem-tra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Chạy kiểm tra
        run: node scripts/kiem-tra.js
